<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Support agent admin{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <style>
    :root { --fg:#1d1d1f; --muted:#6b6b70; --line:#e3e3e6; --bg:#fafafa; --ok:#1f7a3a; --bad:#b3261e; --accent:#2b5cd7; }
    body { font: 14px/1.5 system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--bg); margin: 0; }
    header { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 24px; display:flex; justify-content:space-between; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px 24px 48px; }
    h1 { font-size: 18px; margin: 0; } h2 { font-size: 16px; margin: 28px 0 8px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .muted { color: var(--muted); } .ticket { white-space: pre-wrap; max-width: 420px; }
    button { border: 1px solid var(--line); background: #fff; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
    button.approve { border-color: var(--ok); color: var(--ok); } button.reject { border-color: var(--bad); color: var(--bad); }
    input[type=text] { padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; width: 160px; }
    .pill { font-size: 12px; padding: 1px 8px; border-radius: 10px; background: #eee; }
    .pill.completed, .pill.approved { background: #e2f4e7; color: var(--ok); }
    .pill.escalated, .pill.rejected, .pill.failed { background: #fbe4e2; color: var(--bad); }
    .pill.awaiting_approval, .pill.pending { background: #fff3d6; color: #8a5a00; }
    pre { white-space: pre-wrap; word-break: break-word; background: #fff; border: 1px solid var(--line); padding: 8px; margin: 4px 0; font-size: 12px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <header><h1>Maple Street Goods &middot; support agent</h1><span class="muted">{{ user }}</span></header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
